<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイクルメーター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600&family=Barlow+Condensed:wght@500;600&family=Share+Tech+Mono&display=swap">
<style>
:root{
  --bg:#cfcbc2; --fg:#1d1d1b; --panel:#e4e0d7; --btn:#2a2a28; --btnfg:#f3efe6; --muted:#6b675e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161615; --fg:#ece8de; --panel:#232321; --btn:#ece8de; --btnfg:#161615; --muted:#9a968b;}
}
:root[data-theme="dark"]{--bg:#161615; --fg:#ece8de; --panel:#232321; --btn:#ece8de; --btnfg:#161615; --muted:#9a968b;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:420px;padding:16px 16px 28px}
.dial{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.lcd{margin-top:14px;background:#b9c6a2;color:#1c2a14;border-radius:10px;padding:12px 16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);font-family:"Share Tech Mono",ui-monospace,monospace}
.dial text{font-family:Arimo,"Helvetica Neue",Helvetica,Arial,sans-serif}
.dial text.od{font-family:"Barlow Semi Condensed","Arial Narrow",sans-serif}
.lcd .clkrow{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(28,42,20,.35);padding-bottom:6px;margin-bottom:8px}
.lcd .clk{font-size:30px;letter-spacing:2px}
.lcd .dt{font-size:15px;opacity:.8;font-family:"Barlow Condensed","Noto Sans JP",sans-serif}
.lcd .tmp{font-size:24px}
.lcd .big{display:flex;align-items:baseline;justify-content:center;gap:10px}
.lcd .v{font-size:76px;line-height:1;letter-spacing:2px}
.lcd .u{font-size:22px}
.lcd .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center;border-top:1px solid rgba(28,42,20,.35);padding-top:8px}
.lcd .row b{display:block;font-size:22px;font-weight:400}
.lcd .row span{font-size:12px;opacity:.75;font-family:"Barlow Condensed","Noto Sans JP",sans-serif}
.map{position:relative;margin-top:14px;border-radius:10px;overflow:hidden;background:#101311;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
.map canvas{display:block;width:100%;height:190px}
.mc{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.mc button{padding:3px 10px;font-size:16px;background:rgba(236,232,222,.92);color:#161615;border-radius:6px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
button{font:inherit;font-size:19px;font-weight:600;padding:12px 8px;border:0;border-radius:8px;background:var(--btn);color:var(--btnfg);cursor:pointer}
button:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
button[aria-pressed="true"]{background:#2f8f3f;color:#fff}
.msg{min-height:1.4em;margin:10px 2px 0;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<main>
<svg class="dial" id="dial" viewBox="0 0 300 340" role="img" aria-label="アナログ速度計"></svg>

<div class="lcd" aria-live="off">
  <div class="clkrow"><span class="dt" id="dt"></span><span class="tmp" id="tmp">--°C</span><span class="clk" id="clk">00:00:00</span></div>
  <div class="big"><span class="v" id="dv">0.0</span><span class="u" id="du">km/h</span></div>
  <div class="row">
    <div><b id="trip">0.00</b><span id="tripL">トリップ km</span></div>
    <div><b id="max">0.0</b><span>最高速</span></div>
    <div><b id="avg">0.0</b><span>平均速度</span></div>
  </div>
</div>

<div class="map"><canvas id="map" aria-label="走行軌跡の簡易地図"></canvas><div class="mc"><button id="mIn" aria-label="拡大">＋</button><button id="mOut" aria-label="縮小">－</button><button id="mTile" aria-pressed="true">地図</button><button id="mFit" aria-pressed="false">全体</button></div></div>

<div class="ctl">
  <button id="bGps" aria-pressed="false">GPS計測</button>
  <button id="bDemo" aria-pressed="false">デモ走行</button>
  <button id="bUnit">km/h ⇄ mph</button>
  <button id="bReset">トリップ消去</button>
</div>
<p class="msg" id="msg">「GPS計測」で現在の速度を表示します。</p>
</main>

<script>
(function(){
  // ---------- Dial geometry ----------
  var CX=150, CY=190, A0=-105, SWEEP=200, VMAX=80;
  function ang(v){ return A0 + v/VMAX*SWEEP; }
  function pt(r,a){ var t=a*Math.PI/180; return [CX+r*Math.sin(t), CY-r*Math.cos(t)]; }
  function arc(r,v1,v2){
    var a=pt(r,ang(v1)), b=pt(r,ang(v2)), large=(ang(v2)-ang(v1))>180?1:0;
    return 'M'+a[0].toFixed(2)+' '+a[1].toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+b[0].toFixed(2)+' '+b[1].toFixed(2);
  }
  var s='';
  s+='<defs><linearGradient id="drum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>'
   +'<filter id="ns" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".6"/></filter></defs>';
  s+='<rect x="4" y="4" width="292" height="332" rx="40" fill="#e9eef0" fill-opacity=".9"/>';
  s+='<rect x="12" y="12" width="276" height="316" rx="32" fill="#0b0b0b"/>';
  // colour arc
  var segs=[[0,14,'#2fa84a'],[14,40,'#e6d12e'],[40,58,'#e8892a'],[58,80,'#d8302a']];
  segs.forEach(function(g){ s+='<path d="'+arc(112,g[0],g[1])+'" stroke="'+g[2]+'" stroke-width="5" fill="none"/>'; });
  // km/h ticks + numbers
  for(var v=0; v<=80; v+=2){
    var major=v%10===0, a=ang(v), p1=pt(major?106:106,a), p2=pt(major?97:101,a);
    s+='<line x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'" stroke="#eee" stroke-width="'+(major?2:1)+'"/>';
    if(major){ var n=pt(128,a); s+='<text x="'+n[0].toFixed(2)+'" y="'+(n[1]+6).toFixed(2)+'" fill="#f1f1ee" font-size="17" font-weight="700" text-anchor="middle" font-family="Barlow Condensed,sans-serif">'+v+'</text>'; }
  }
  // mph inner scale (0-50 mph)
  for(var m=0; m<=50; m+=5){
    var vk=m*1.609344, a2=ang(vk), q1=pt(88,a2), q2=pt(m%10===0?81:84,a2);
    s+='<line x1="'+q1[0].toFixed(2)+'" y1="'+q1[1].toFixed(2)+'" x2="'+q2[0].toFixed(2)+'" y2="'+q2[1].toFixed(2)+'" stroke="#bbb" stroke-width="1"/>';
    if(m%10===0){ var nn=pt(70,a2); s+='<text x="'+nn[0].toFixed(2)+'" y="'+(nn[1]+4).toFixed(2)+'" fill="#bdbdb8" font-size="10" text-anchor="middle" font-family="Barlow Condensed,sans-serif">'+m+'</text>'; }
  }
  // odometer window
  function win(id,y,n,x0){
    var W=17,H=24,o='',i,bx=x0+n*W+3;
    o+='<rect x="'+(x0-2)+'" y="'+(y-2)+'" width="'+(n*W+4)+'" height="'+(H+4)+'" rx="3" fill="#0a0a0a" stroke="#8d8d8d" stroke-width="1.3"/>';
    for(i=0;i<n;i++){
      o+='<text id="'+id+i+'" x="'+(x0+i*W+W/2)+'" y="'+(y+H-4)+'" text-anchor="middle" class="od" font-size="22" font-weight="600" fill="#f4f4f0" font-family="Barlow Condensed,Arial Narrow,sans-serif">0</text>';
      if(i>0) o+='<line x1="'+(x0+i*W)+'" y1="'+y+'" x2="'+(x0+i*W)+'" y2="'+(y+H)+'" stroke="#555" stroke-width=".8"/>';
    }
    o+='<rect x="'+x0+'" y="'+y+'" width="'+(n*W)+'" height="'+H+'" fill="url(#drum)"/>';
    o+='<rect x="'+bx+'" y="'+(y-2)+'" width="'+W+'" height="'+(H+4)+'" rx="2" fill="#f4f4f0" stroke="#8d8d8d" stroke-width="1.3"/>';
    o+='<text id="'+id+'D" x="'+(bx+W/2)+'" y="'+(y+H-4)+'" text-anchor="middle" class="od" font-size="22" font-weight="600" fill="#111" font-family="Barlow Condensed,Arial Narrow,sans-serif">0</text>';
    o+='<rect x="'+bx+'" y="'+(y-2)+'" width="'+W+'" height="'+(H+4)+'" rx="2" fill="url(#gl)" opacity=".6"/>';
    return o;
  }
  s+=win('odo',220,4,107)+win('trip',266,3,124);
  s+='<text x="101" y="236" text-anchor="end" fill="#aaa" font-size="11" font-family="Barlow Condensed,sans-serif">ODO</text>';
  s+='<text x="118" y="282" text-anchor="end" fill="#aaa" font-size="11" font-family="Barlow Condensed,sans-serif">TRIP</text>';
  s+='<text id="ulab" x="150" y="259" text-anchor="middle" fill="#ddd" font-size="13" font-weight="600" font-family="Barlow Condensed,sans-serif">KM/H</text>';
  // screws
  s+='<circle cx="52" cy="238" r="5" fill="#555"/><circle cx="248" cy="238" r="5" fill="#555"/>';
  // needle
  s+='<g id="needle" transform="translate('+CX+' '+CY+') rotate('+A0+')"><polygon points="-3.2,16 3.2,16 1.2,-108 -1.2,-108" fill="#f2c230" filter="url(#ns)"/></g>';
  s+='<circle cx="'+CX+'" cy="'+CY+'" r="11" fill="#6a6a66"/><circle cx="'+CX+'" cy="'+CY+'" r="5" fill="#2b2b29"/>';
  // glass highlight
  s+='<rect x="4" y="4" width="292" height="332" rx="40" fill="url(#gl)"/>';
  document.getElementById('dial').innerHTML=s;

  // ---------- State ----------
  var $=function(i){return document.getElementById(i);};
  var needle=$('needle');
  var st={target:0,cur:0,trip:0,max:0,moveSec:0,odo:0,mph:false,mode:null};
  try{ var o=parseFloat(localStorage.getItem('bike_odo')); if(isFinite(o)) st.odo=o; if(localStorage.getItem('bike_mph')==='1') st.mph=true; }catch(e){}
  var K=0.621371;

  function onSpeed(kmh,dt){
    if(kmh<1) kmh=0;
    st.target=kmh;
    if(kmh>0){
      var d=kmh*dt/3600; st.trip+=d; st.odo+=d; st.moveSec+=dt;
      if(kmh>st.max) st.max=kmh;
    }
  }
  function setOd(id,val,n){ var t=(Math.floor(val*10)/10)%Math.pow(10,n), p=t.toFixed(1).split('.'), a=p[0].padStart(n,'0'); for(var i=0;i<n;i++) $(id+i).textContent=a[i]; $(id+'D').textContent=p[1]; }
  function fmt(){
    var f=st.mph?K:1, u=st.mph?'mph':'km/h';
    $('dv').textContent=(st.cur*f).toFixed(1);
    $('du').textContent=u;
    $('trip').textContent=(st.trip*f).toFixed(2);
    $('tripL').textContent='トリップ '+(st.mph?'mi':'km');
    $('max').textContent=(st.max*f).toFixed(1);
    $('avg').textContent=((st.moveSec>0?st.trip/(st.moveSec/3600):0)*f).toFixed(1);
    setOd('odo',st.odo*f,4); setOd('trip',st.trip*f,3);
    $('ulab').textContent=st.mph?'MPH':'KM/H'; showTemp();
  }
  function loop(){
    st.cur+=(st.target-st.cur)*0.12; if(Math.abs(st.target-st.cur)<0.02) st.cur=st.target;
    var v=Math.min(st.cur,VMAX+2);
    needle.setAttribute('transform','translate('+CX+' '+CY+') rotate('+ang(v).toFixed(2)+')');
    fmt(); requestAnimationFrame(loop);
  }
  loop();
  setInterval(function(){ try{ localStorage.setItem('bike_odo',String(st.odo)); }catch(e){} },5000);

  function tick(){
    var d=new Date();
    $('clk').textContent=d.toLocaleTimeString('ja-JP',{hour12:false});
    $('dt').textContent=d.toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',weekday:'short'});
  }
  tick(); setInterval(tick,1000);

  var tC=null, tAt=0, tLoc=null;
  function showTemp(){ $('tmp').textContent = tC==null ? '--°C' : (st.mph ? Math.round(tC*9/5+32)+'°F' : Math.round(tC)+'°C'); }
  function getTemp(lat,lon){
    var now=Date.now();
    if(tLoc && now-tAt<600000 && hav(tLoc,{latitude:lat,longitude:lon})<5) return;
    tAt=now; tLoc={latitude:lat,longitude:lon};
    try{
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(3)+'&longitude='+lon.toFixed(3)+'&current=temperature_2m')
        .then(function(r){return r.json();})
        .then(function(j){ if(j&&j.current&&typeof j.current.temperature_2m==='number'){ tC=j.current.temperature_2m; showTemp(); } })
        .catch(function(){ tAt=now-540000; });
    }catch(e){ tAt=now-540000; }
  }

  // ---------- Map (track view, no tiles) ----------
  var mp={pts:[],ref:null,mode:null,x:0,y:0,hd:0,zi:2,fit:false,has:false,tiles:true};
  var RANGES=[100,200,500,1000,2000,5000,10000], NICE=[10,20,50,100,200,500,1000,2000,5000,10000,20000];
  function mapReset(){ mp.pts=[]; mp.ref=null; mp.has=false; mp.x=0; mp.y=0; }
  function mapAdd(x,y){
    var L=mp.pts[mp.pts.length-1];
    if(L){ var dx=x-L.x, dy=y-L.y; if(Math.sqrt(dx*dx+dy*dy)<5){ mp.x=x; mp.y=y; mp.has=true; return; } mp.hd=Math.atan2(dx,dy); }
    mp.pts.push({x:x,y:y}); mp.x=x; mp.y=y; mp.has=true;
    if(mp.pts.length>4000) mp.pts=mp.pts.filter(function(_,i){return i%2===0;});
  }
  function mapGps(c){
    if(c.accuracy>50) return;
    if(!mp.ref) mp.ref={lat:c.latitude,lon:c.longitude};
    mapAdd((c.longitude-mp.ref.lon)*Math.cos(mp.ref.lat*Math.PI/180)*111320,(c.latitude-mp.ref.lat)*110540);
  }
  var cv=$('map'), g=cv.getContext('2d');
  // OpenStreetMap tiles (change TILE_URL to use another tile server)
  var TILE_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png', tcache={}, tcount=0;
  function getTile(z,x,y){
    var k=z+'/'+x+'/'+y, t=tcache[k];
    if(t) return t;
    if(tcount>600){ tcache={}; tcount=0; }
    t=new Image(); t.ok=false;
    t.onload=function(){ t.ok=true; drawMap(); };
    t.src=TILE_URL.replace('{z}',z).replace('{x}',x).replace('{y}',y);
    tcache[k]=t; tcount++; return t;
  }
  function drawTiles(W,H,cx,cy,ppm){
    if(!mp.ref) return false;
    var lat=Math.max(-84,Math.min(84,mp.ref.lat+cy/110540)), lon=mp.ref.lon+cx/(111320*Math.cos(mp.ref.lat*Math.PI/180));
    var cl=Math.cos(lat*Math.PI/180), dpr=window.devicePixelRatio||1;
    var z=Math.max(3,Math.min(19,Math.round(Math.log(156543.03*cl*ppm*dpr)/Math.LN2))), n=Math.pow(2,z);
    var f=ppm*156543.03*cl/n, latR=lat*Math.PI/180;
    var px=(lon+180)/360*n*256, py=(1-Math.log(Math.tan(latR)+1/Math.cos(latR))/Math.PI)/2*n*256;
    var ts=256*f, any=false;
    var x0=Math.floor((px-W/2/f)/256), x1=Math.floor((px+W/2/f)/256);
    var y0=Math.max(0,Math.floor((py-H/2/f)/256)), y1=Math.min(n-1,Math.floor((py+H/2/f)/256));
    for(var ty=y0;ty<=y1;ty++) for(var tx=x0;tx<=x1;tx++){
      var t=getTile(z,((tx%n)+n)%n,ty);
      if(t.ok){ g.drawImage(t,W/2+(tx*256-px)*f,H/2+(ty*256-py)*f,ts+.5,ts+.5); any=true; }
    }
    return any;
  }
  function drawMap(){
    var dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight, i;
    if(!W||!H) return;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    g.setTransform(dpr,0,0,dpr,0,0); g.fillStyle='#101311'; g.fillRect(0,0,W,H);
    g.textAlign='center'; g.font='14px Arimo,sans-serif';
    if(!mp.has){ g.fillStyle='#8f958f'; g.fillText('走行軌跡がここに表示されます',W/2,H/2+5); return; }
    var cx=mp.x, cy=mp.y, ppm=(W/2)/RANGES[mp.zi];
    if(mp.fit){
      var x1=mp.x,x2=mp.x,y1=mp.y,y2=mp.y;
      mp.pts.forEach(function(p){ if(p.x<x1)x1=p.x; if(p.x>x2)x2=p.x; if(p.y<y1)y1=p.y; if(p.y>y2)y2=p.y; });
      cx=(x1+x2)/2; cy=(y1+y2)/2;
      ppm=Math.min(0.8*W/Math.max(x2-x1,20),0.8*H/Math.max(y2-y1,20),(W/2)/50);
    }
    function X(x){return W/2+(x-cx)*ppm;} function Y(y){return H/2-(y-cy)*ppm;}
    var step=NICE[NICE.length-1]; for(i=0;i<NICE.length;i++){ if(NICE[i]*ppm>=36){ step=NICE[i]; break; } }
    var tl=mp.tiles&&drawTiles(W,H,cx,cy,ppm);
    g.strokeStyle=tl?'rgba(0,0,0,0)':'#1f2622'; g.lineWidth=1; g.beginPath();
    for(var gx=Math.ceil((cx-W/2/ppm)/step)*step; gx<=cx+W/2/ppm; gx+=step){ var sx=Math.round(X(gx))+.5; g.moveTo(sx,0); g.lineTo(sx,H); }
    for(var gy=Math.ceil((cy-H/2/ppm)/step)*step; gy<=cy+H/2/ppm; gy+=step){ var sy=Math.round(Y(gy))+.5; g.moveTo(0,sy); g.lineTo(W,sy); }
    g.stroke();
    if(mp.pts.length>1){
      [[mp.tiles&&tl?'rgba(0,0,0,.55)':null,6],['#f2c230',3]].forEach(function(s){
        if(!s[0]) return;
        g.strokeStyle=s[0]; g.lineWidth=s[1]; g.lineJoin='round'; g.lineCap='round'; g.beginPath();
        mp.pts.forEach(function(p,k){ if(k) g.lineTo(X(p.x),Y(p.y)); else g.moveTo(X(p.x),Y(p.y)); });
        g.lineTo(X(mp.x),Y(mp.y)); g.stroke();
      });
    }
    var s0=mp.pts[0]; if(s0){ g.fillStyle='#2fa84a'; g.beginPath(); g.arc(X(s0.x),Y(s0.y),5,0,6.2832); g.fill(); }
    g.save(); g.translate(X(mp.x),Y(mp.y)); g.rotate(mp.hd); g.fillStyle='#e8492a'; g.strokeStyle='#fff'; g.lineWidth=2;
    g.beginPath(); g.moveTo(0,-11); g.lineTo(8,9); g.lineTo(0,5); g.lineTo(-8,9); g.closePath(); g.fill(); g.stroke(); g.restore();
    var sb=NICE[0]; for(i=0;i<NICE.length;i++){ if(NICE[i]*ppm<=W/3) sb=NICE[i]; }
    g.shadowColor='rgba(0,0,0,.9)'; g.shadowBlur=3;
    var bl=sb*ppm; g.strokeStyle='#eee'; g.lineWidth=2; g.beginPath();
    g.moveTo(12,H-12); g.lineTo(12+bl,H-12); g.moveTo(12,H-17); g.lineTo(12,H-7); g.moveTo(12+bl,H-17); g.lineTo(12+bl,H-7); g.stroke();
    g.fillStyle='#eee'; g.textAlign='left'; g.fillText(sb>=1000?(sb/1000)+' km':sb+' m',12,H-22);
    g.textAlign='center'; g.fillText('N',W-14,26); g.beginPath(); g.moveTo(W-14,6); g.lineTo(W-19,17); g.lineTo(W-9,17); g.closePath(); g.fill();
    if(mp.tiles){ g.font='10px Arimo,sans-serif'; g.textAlign='left'; g.fillText(tl?'© OpenStreetMap contributors':'地図を読み込めません（軌跡のみ表示）',6,12); }
    g.shadowBlur=0;
  }
  $('mIn').onclick=function(){ mp.zi=Math.max(0,mp.zi-1); drawMap(); };
  $('mOut').onclick=function(){ mp.zi=Math.min(RANGES.length-1,mp.zi+1); drawMap(); };
  $('mFit').onclick=function(){ mp.fit=!mp.fit; this.setAttribute('aria-pressed',mp.fit?'true':'false'); drawMap(); };
  $('mTile').onclick=function(){ mp.tiles=!mp.tiles; this.setAttribute('aria-pressed',mp.tiles?'true':'false'); drawMap(); };
  drawMap(); setInterval(drawMap,500);

  // ---------- Sources ----------
  var watchId=null, demoId=null, last=null, wake=null;
  function msg(t){ $('msg').textContent=t; }
  function stopAll(){
    if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
    if(demoId!==null){ clearInterval(demoId); demoId=null; }
    if(wake){ try{ wake.release(); }catch(e){} wake=null; }
    st.target=0; last=null; st.mode=null;
    $('bGps').setAttribute('aria-pressed','false'); $('bDemo').setAttribute('aria-pressed','false');
  }
  function hav(a,b){
    var R=6371, r=Math.PI/180, dLa=(b.latitude-a.latitude)*r, dLo=(b.longitude-a.longitude)*r;
    var x=Math.sin(dLa/2)**2+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dLo/2)**2;
    return 2*R*Math.asin(Math.sqrt(x));
  }
  $('bGps').onclick=function(){
    if(st.mode==='gps'){ stopAll(); msg('停止しました。'); return; }
    stopAll();
    if(!navigator.geolocation){ msg('この端末では位置情報が使えません。デモ走行を試してください。'); return; }
    if(mp.mode!=='gps'){ mapReset(); mp.mode='gps'; } st.mode='gps'; $('bGps').setAttribute('aria-pressed','true'); msg('GPSの信号を待っています…');
    try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){wake=w;}).catch(function(){}); }catch(e){}
    watchId=navigator.geolocation.watchPosition(function(p){
      var c=p.coords, now=p.timestamp, kmh=null;
      if(typeof c.speed==='number' && isFinite(c.speed)) kmh=c.speed*3.6;
      else if(last){ var dt=(now-last.t)/1000; if(dt>0) kmh=hav(last.c,c)/dt*3600; }
      var dt2=last?(now-last.t)/1000:1; if(dt2>5||dt2<=0) dt2=1;
      last={t:now,c:c}; getTemp(c.latitude,c.longitude); mapGps(c);
      if(kmh!==null){ onSpeed(kmh,dt2); msg('GPS計測中（精度 約'+Math.round(c.accuracy)+'m）'); }
    },function(e){
      stopAll();
      msg(e.code===1?'位置情報の許可がオフです。ブラウザの設定で許可してください（埋め込み表示では使えない場合があります。その場合はデモ走行をお試しください）。':'位置情報を取得できませんでした。屋外で再度お試しください。');
    },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  };
  $('bDemo').onclick=function(){
    if(st.mode==='demo'){ stopAll(); msg('停止しました。'); return; }
    if(mp.mode!=='demo'){ mapReset(); mp.mode='demo'; mp.hd=0; mp.ref={lat:35.6812,lon:139.7671}; } stopAll(); st.mode='demo'; $('bDemo').setAttribute('aria-pressed','true'); msg('デモ走行中（疑似データ）');
    var goal=22;
    demoId=setInterval(function(){
      if(Math.random()<0.18) goal=Math.max(0,Math.min(62,goal+(Math.random()*30-12)));
      var cur=st.target+(goal-st.target)*0.25; onSpeed(cur,0.3);
      var sp=cur/3.6*0.3; mp.hd+=0.015+(Math.random()-0.5)*0.15; mapAdd(mp.x+Math.sin(mp.hd)*sp,mp.y+Math.cos(mp.hd)*sp);
    },300);
  };
  $('bUnit').onclick=function(){ st.mph=!st.mph; try{ localStorage.setItem('bike_mph',st.mph?'1':'0'); }catch(e){} };
  $('bReset').onclick=function(){ st.trip=0; st.max=0; st.moveSec=0; mapReset(); drawMap(); };
})();
</script>
